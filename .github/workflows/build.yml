name: Build iPhone app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Test pairing and encrypted frame compatibility
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')
          echo "SIMULATOR_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcodebuild test -project RoomGuard.xcodeproj -scheme RoomGuard -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath simulator-build CODE_SIGNING_ALLOWED=NO -quiet
      - name: Capture iPhone interface
        run: |
          xcrun simctl bootstatus "$SIMULATOR_DEVICE" -b
          xcrun simctl install "$SIMULATOR_DEVICE" simulator-build/Build/Products/Debug-iphonesimulator/RoomGuard.app
          xcrun simctl launch "$SIMULATOR_DEVICE" app.roomguard.viewer
          sleep 3
          xcrun simctl io "$SIMULATOR_DEVICE" screenshot RoomGuard-iPhone.png
      - name: Build device app
        run: |
          xcodebuild -project RoomGuard.xcodeproj -scheme RoomGuard -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet build
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/RoomGuard.app package/Payload/
          cd package
          /usr/bin/zip -qr ../RoomGuard.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RoomGuard-iPhone
          path: |
            RoomGuard.ipa
            RoomGuard-iPhone.png
          retention-days: 14
          if-no-files-found: error
